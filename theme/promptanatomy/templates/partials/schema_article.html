{% if article %}

<script type="application/ld+json">

{

  "@context": "https://schema.org",

  "@type": "Article",

  "headline": {{ article.title|tojson }},

  "description": {{ (article.summary or '')|striptags|tojson }},

  "inLanguage": "en-US",

  "image": ["{{ CANONICAL_SITEURL }}/{% if article.slug in OG_ARTICLE_SLUGS %}images/articles/{{ article.slug }}/og.png{% else %}{{ article.hero_image or (THEME_STATIC_DIR ~ '/img/og-default.png') }}{% endif %}"],

  "datePublished": "{{ article.date.isoformat() }}",

  {% if article.modified %}

  "dateModified": "{{ article.modified.isoformat() }}",

  {% endif %}

  "author": {

    "@type": "Person",

    "name": {{ SITE_CONFIG.author.name|tojson }}{% if SITE_CONFIG.author.linkedin or SITE_CONFIG.author.url %},

    "url": {{ (SITE_CONFIG.author.linkedin or SITE_CONFIG.author.url)|tojson }}{% endif %}{% if AUTHOR_HAS_PHOTO and SITE_CONFIG.author.avatar %},

    "image": "{{ CANONICAL_SITEURL }}/{{ SITE_CONFIG.author.avatar }}"{% endif %}

  },

  "publisher": {

    "@id": "{{ CANONICAL_SITEURL }}/#organization"

  },

  "articleSection": {{ article.category.name|tojson }},

  "mainEntityOfPage": {

    "@type": "WebPage",

    "@id": "{{ CANONICAL_SITEURL }}/{{ article.url }}"

  }

}

</script>

{% endif %}
