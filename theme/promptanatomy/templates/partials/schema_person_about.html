{% if page and page.slug == 'about' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ProfilePage",
  "name": {{ (page.title ~ ' — ' ~ SITENAME)|tojson }},
  "url": "{{ CANONICAL_SITEURL }}/about/",
  "inLanguage": "en-US",
  "mainEntity": {
    "@type": "Person",
    "@id": "{{ CANONICAL_SITEURL }}/about/#author",
    "name": {{ SITE_CONFIG.author.name|tojson }},
    "jobTitle": {{ SITE_CONFIG.author.title|tojson }},
    "url": "{{ CANONICAL_SITEURL }}/about/",
    "description": {{ SITE_CONFIG.author.bio|tojson }},
    "sameAs": [
{%- for link in SITE_CONFIG.social.links %}
      {{ link.href|tojson }}{% if not loop.last %},{% endif %}
{%- endfor %}
    ]{% if AUTHOR_HAS_PHOTO and SITE_CONFIG.author.avatar %},
    "image": "{{ CANONICAL_SITEURL }}/{{ SITE_CONFIG.author.avatar }}"{% endif %},
    "worksFor": { "@id": "{{ CANONICAL_SITEURL }}/#organization" }
  }
}
</script>
{% endif %}
