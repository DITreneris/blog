{% if article.faq %}

<script type="application/ld+json">

{

  "@context": "https://schema.org",

  "@type": "FAQPage",

  "mainEntity": [

    {% for item in article.faq %}

    {

      "@type": "Question",

      "name": {{ item.question|seo_plain|tojson }},

      "acceptedAnswer": {

        "@type": "Answer",

        "text": {{ item.answer|seo_plain|tojson }}

      }

    }{% if not loop.last %},{% endif %}

    {% endfor %}

  ]

}

</script>

{% endif %}
