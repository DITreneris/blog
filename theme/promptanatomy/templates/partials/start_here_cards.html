{% from 'macros/ui.html' import section_heading, card %}

<section class="section" aria-labelledby="start-here-heading">

  <div class="container">

    {{ section_heading(HUB_SECTIONS.start_here.title, heading_id='start-here-heading') }}

    <div class="grid grid--3">

      {% for item in HUB_SECTIONS.start_here.cards %}

      {{ card(item.title, item.description, item.href, card_id=loop.index) }}

      {% endfor %}

    </div>

  </div>

</section>
