{% from 'macros/ui.html' import section_heading, btn %}

{% set t = HUB_SECTIONS.templates %}

<section class="section" id="{{ t.id }}" aria-labelledby="templates-heading">

  <div class="container">

    <div class="template-band">

      {{ section_heading(t.title, t.description, 'templates-heading') }}

      {{ btn(t.cta_href, t.cta_label) }}

    </div>

  </div>

</section>
