{% from 'macros/ui.html' import section_heading, article_card %}
{% if related_articles %}
<section class="related-articles container" aria-labelledby="related-heading">
  {{ section_heading('Related articles', heading_id='related-heading') }}
  <div class="grid grid--2">
    {% for rel in related_articles %}
    {{ article_card(rel) }}
    {% endfor %}
  </div>
</section>
{% endif %}
