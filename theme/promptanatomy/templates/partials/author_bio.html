{% set author = SITE_CONFIG.author %}

<aside class="author-bio container" aria-label="About the author">

  {% if author.avatar %}

  <img class="author-bio__avatar author-bio__avatar--image" src="/{{ author.avatar }}" alt="{{ author.name }}" width="56" height="56" loading="lazy" decoding="async" />

  {% else %}

  <div class="author-bio__avatar" role="img" aria-label="Author avatar placeholder"></div>

  {% endif %}

  <div>

    <p><strong>{{ author.name }}</strong> — {{ author.title }}</p>

    <p>{{ author.bio }}</p>

  </div>

</aside>
