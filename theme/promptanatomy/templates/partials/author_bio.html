{% set author = SITE_CONFIG.author %}

<aside class="author-bio container{% if not author.avatar %} author-bio--no-avatar{% endif %}" aria-label="About the author">

  {% if author.avatar and AUTHOR_HAS_PHOTO %}

  <img class="author-bio__avatar author-bio__avatar--image" src="/{{ author.avatar }}" alt="{{ author.name }}" width="56" height="56" loading="lazy" decoding="async" />

  {% endif %}

  <div>

    <p>

      {% if author.linkedin %}

      <a class="author-bio__name-link" href="{{ author.linkedin }}" rel="noopener noreferrer me" target="_blank"><strong>{{ author.name }}</strong></a>

      {% else %}

      <strong>{{ author.name }}</strong>

      {% endif %}

      — {{ author.title }}

    </p>

    <p>{{ author.bio }}</p>

  </div>

</aside>
