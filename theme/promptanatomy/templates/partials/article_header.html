{% from 'macros/ui.html' import category_badge, meta_line, hero_image_url, responsive_hero_img %}
<header class="article-header">
  <div class="container">
    {{ category_badge(article.category, '/' ~ article.category.url if article.category else none) }}
    <h1 class="article-header__title">{{ article.title }}</h1>
    {{ meta_line(article) }}
    {% if article.hero_image %}
    <figure class="article-header__figure">
      {{ responsive_hero_img(hero_image_url(article), article.title|striptags|replace('\"', '')|replace('"', ''), 'article-header__diagram', 1600, 900, true) }}
      {% if article.hero_caption %}
      <figcaption class="article-header__caption">{{ article.hero_caption }}</figcaption>
      {% endif %}
    </figure>
    {% else %}
    <div class="article-header__diagram article-header__diagram--placeholder" role="img" aria-label="Diagram placeholder"></div>
    {% endif %}
  </div>
</header>
